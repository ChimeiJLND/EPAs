<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>護理部臨床照護評估系統｜佳里奇美醫院</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#15302C;
    --bg-panel:#1D3D37;
    --gold:#E3A857;
    --sage:#8FB6A0;
    --cream:#F6F1E4;
    --ink-soft:rgba(246,241,228,.72);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Noto Sans TC', sans-serif;
    background:var(--bg-deep);
    color:var(--cream);
    min-height:100vh;
    display:flex; flex-direction:column;
    overflow-x:hidden;
    position:relative;
  }

  /* ---------- 背景插畫：輻射弧線 + 手繪風幼苗圖案 ---------- */
  .bg-arcs{
    position:absolute; inset:0; z-index:0; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  .bg-arcs svg{width:min(1400px, 180vw); height:auto; opacity:.9;}

  header{
    position:relative; z-index:2;
    padding:22px clamp(20px,5vw,56px) 0;
    font-size:13px; letter-spacing:.02em; color:var(--ink-soft);
  }

  main{
    position:relative; z-index:2;
    flex:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    padding:40px clamp(20px,6vw,56px) 60px;
  }

  .eyebrow{
    font-size:14px; color:var(--sage); margin-bottom:18px; letter-spacing:.03em;
  }

  h1{
    font-family:'LXGW WenKai TC', serif;
    font-weight:600;
    font-size:clamp(34px, 6vw, 58px);
    line-height:1.35;
    color:var(--cream);
    max-width:14ch;
    margin:0 auto 22px;
  }

  .subtitle{
    font-size:clamp(15px,2vw,17px);
    color:var(--ink-soft);
    max-width:36ch;
    line-height:1.9;
    margin:0 auto 40px;
  }

  .cta-row{
    display:flex; gap:16px; flex-wrap:wrap; justify-content:center;
  }
  .btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:14px 30px;
    border-radius:999px;
    font-size:15px; font-weight:500;
    text-decoration:none;
    transition:transform .15s ease, background .15s ease;
    cursor:pointer;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{
    background:var(--gold); color:#1D2A1F; font-weight:700;
  }
  .btn-primary:hover{background:#eebb75;}
  .btn-ghost{
    background:transparent; color:var(--cream);
    border:1px solid rgba(246,241,228,.35);
  }
  .btn-ghost:hover{border-color:var(--cream); background:rgba(246,241,228,.06);}

  footer{
    position:relative; z-index:2;
    text-align:center; padding:20px; font-size:12px; color:rgba(246,241,228,.45);
  }

  @media (max-width:480px){
    .cta-row{flex-direction:column; width:100%;}
    .btn{justify-content:center; width:100%;}
  }

  @media (prefers-reduced-motion: no-preference){
    .sprout{animation:sway 6s ease-in-out infinite;}
  }
  @keyframes sway{
    0%,100%{ transform:rotate(0deg); }
    50%{ transform:rotate(2deg); }
  }
</style>
</head>
<body>

<div class="bg-arcs" aria-hidden="true">
  <svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
    <circle cx="500" cy="640" r="120" stroke="var(--sage)" stroke-opacity="0.35" stroke-width="1" fill="none"/>
    <circle cx="500" cy="640" r="220" stroke="var(--sage)" stroke-opacity="0.25" stroke-width="1" fill="none"/>
    <circle cx="500" cy="640" r="320" stroke="var(--gold)" stroke-opacity="0.22" stroke-width="1" fill="none"/>
    <circle cx="500" cy="640" r="420" stroke="var(--sage)" stroke-opacity="0.15" stroke-width="1" fill="none"/>
    <circle cx="500" cy="640" r="520" stroke="var(--gold)" stroke-opacity="0.10" stroke-width="1" fill="none"/>

    <!-- 手繪風：一隻手托著幼苗，象徵陪伴與成長 -->
    <g class="sprout" transform="translate(500,430)" stroke="var(--gold)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
      <!-- 手掌 -->
      <path d="M -60 40 Q -70 70 -40 82 Q 0 96 40 82 Q 70 70 60 40 Q 55 20 30 18 Q 10 5 -10 18 Q -35 8 -50 22 Q -62 28 -60 40 Z"/>
      <!-- 莖 -->
      <path d="M 0 20 C 0 -10, -6 -30, 0 -55"/>
      <!-- 左葉 -->
      <path d="M 0 -35 C -28 -40, -34 -62, -14 -78 C -2 -60, -4 -44, 0 -35 Z" fill="var(--sage)" fill-opacity="0.5" stroke="var(--sage)"/>
      <!-- 右葉 -->
      <path d="M 0 -50 C 26 -56, 32 -78, 12 -92 C 0 -76, 0 -60, 0 -50 Z" fill="var(--sage)" fill-opacity="0.5" stroke="var(--sage)"/>
    </g>
  </svg>
</div>

<header>奇美醫療財團法人佳里奇美醫院　護理部</header>

<main>
  <div class="eyebrow">共通照護 EPAs・臨床照護評估表單</div>
  <h1>看見每一次<br>獨立執行的成長</h1>
  <p class="subtitle">
    從在旁協助、事後確認，到能獨立執行、指導他人——
    每一份評估，都是陪伴學員成長的紀錄。
  </p>
  <div class="cta-row">
    <a class="btn btn-primary" href="epa-form.html">開始評估　▸</a>
    <a class="btn btn-ghost" href="epa-form.html?view=search">查詢歷史紀錄</a>
  </div>
</main>

<footer>奇美醫療財團法人佳里奇美醫院・護理部　製作</footer>

</body>
</html>
